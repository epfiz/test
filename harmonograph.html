<title>Гармонограф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a drawing table — the plate (canvas) on the left, the machine's dials on the right; stacks on phones. */
  :root {
    --paper: #eef1f4;
    --plate: #fbfcfd;
    --ink: #1d2a5c;
    --ink-soft: #5b6687;
    --rule: #d3d9e3;
    --pen: #2f45b8;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12151d; --plate: #181c26; --ink: #e3e7f3; --ink-soft: #949cb5;
      --rule: #2a3040; --pen: #8fa6ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12151d; --plate: #181c26; --ink: #e3e7f3; --ink-soft: #949cb5;
    --rule: #2a3040; --pen: #8fa6ff; color-scheme: dark;
  }

  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.5;
    padding-inline: 16px; padding-block: 28px 40px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 24px; }
  header { display: grid; gap: 6px; }
  h1 {
    font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em;
    font-size: clamp(28px, 6vw, 48px); line-height: 1; margin: 0; text-wrap: balance;
  }
  .lede { margin: 0; max-width: 62ch; color: var(--ink-soft); }

  .table { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
  @media (max-width: 760px) { .table { grid-template-columns: minmax(0, 1fr); } }

  .plate {
    background: var(--plate); border: 1px solid var(--rule); border-radius: 4px;
    aspect-ratio: 1; max-width: 100%; position: relative;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .stamp {
    position: absolute; left: 14px; bottom: 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
  }

  .dials { display: grid; gap: 18px; min-width: 0; }
  .group { display: grid; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
  .label {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-soft);
  }
  .row { display: grid; gap: 4px; }
  .row-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .row-head output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--pen); }
  input[type="range"] { width: 100%; accent-color: var(--pen); }

  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: 500 14px var(--font-body); cursor: pointer; border-radius: 3px;
    padding: 9px 14px; border: 1px solid var(--pen); background: transparent; color: var(--pen);
  }
  button.primary { background: var(--pen); color: var(--plate); }
  button:hover { filter: brightness(1.1); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

  .formula {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-soft);
    overflow-x: auto; white-space: pre; margin: 0;
  }
</style>

<div class="wrap">
  <header>
    <h1>Гармонограф</h1>
    <p class="lede">Викторианская машина для рисования: два затухающих маятника качают перо и стол. Когда частоты почти кратны, линия медленно «плывёт» и складывается в узор. Покрутите ручки или нажмите «Новый узор».</p>
  </header>

  <div class="table">
    <div class="plate">
      <canvas id="c" aria-label="Рисунок гармонографа"></canvas>
      <div class="stamp" id="stamp">f 2 : 3</div>
    </div>

    <div class="dials">
      <div class="group">
        <span class="label">Маятники</span>
        <div class="row">
          <div class="row-head"><label for="fx">Частота по X</label><output id="fx-o"></output></div>
          <input id="fx" type="range" min="1" max="7" step="1" value="2">
        </div>
        <div class="row">
          <div class="row-head"><label for="fy">Частота по Y</label><output id="fy-o"></output></div>
          <input id="fy" type="range" min="1" max="7" step="1" value="3">
        </div>
        <div class="row">
          <div class="row-head"><label for="dt">Расстройка</label><output id="dt-o"></output></div>
          <input id="dt" type="range" min="0" max="0.03" step="0.001" value="0.008">
        </div>
        <div class="row">
          <div class="row-head"><label for="dm">Затухание</label><output id="dm-o"></output></div>
          <input id="dm" type="range" min="0.001" max="0.02" step="0.001" value="0.004">
        </div>
      </div>
      <div class="buttons">
        <button class="primary" id="rand" type="button">Новый узор</button>
        <button id="replay" type="button">Нарисовать заново</button>
      </div>
      <pre class="formula" id="formula"></pre>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const inputs = ["fx", "fy", "dt", "dm"].map($);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let phases = [0, Math.PI / 2, Math.PI / 4, 0];
  let raf = 0;

  const params = () => ({
    fx: +$("fx").value, fy: +$("fy").value, dt: +$("dt").value, dm: +$("dm").value
  });

  // Two pendulums per axis: x is driven by pendulums 1 and 2, y by 3 and 4.
  function point(p, t) {
    const e = Math.exp(-p.dm * t);
    const x = Math.sin(p.fx * t + phases[0]) + Math.sin((p.fx + p.dt) * t + phases[1]) * 0.6;
    const y = Math.sin(p.fy * t + phases[2]) + Math.sin((p.fy - p.dt) * t + phases[3]) * 0.6;
    return [x * e / 1.6, y * e / 1.6];
  }

  function size() {
    const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);
  }

  function label() {
    const p = params();
    $("fx-o").textContent = p.fx;
    $("fy-o").textContent = p.fy;
    $("dt-o").textContent = p.dt.toFixed(3);
    $("dm-o").textContent = p.dm.toFixed(3);
    $("stamp").textContent = `f ${p.fx} : ${p.fy}   δ ${p.dt.toFixed(3)}`;
    const f = n => n.toFixed(2);
    $("formula").textContent =
      `x(t) = e^(−${p.dm.toFixed(3)}t)·[sin(${p.fx}t+${f(phases[0])})\n` +
      `       + 0.6·sin(${f(p.fx + p.dt)}t+${f(phases[1])})]\n` +
      `y(t) = e^(−${p.dm.toFixed(3)}t)·[sin(${p.fy}t+${f(phases[2])})\n` +
      `       + 0.6·sin(${f(p.fy - p.dt)}t+${f(phases[3])})]`;
  }

  function draw() {
    cancelAnimationFrame(raf);
    size(); label();
    const p = params();
    const w = canvas.width, h = canvas.height, s = Math.min(w, h) * 0.44;
    const pen = getComputedStyle(document.documentElement).getPropertyValue("--pen").trim();
    const T = Math.min(5 / p.dm, 1400), dt = 0.02, perFrame = reduce ? Infinity : 900;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = pen; ctx.lineWidth = Math.max(1, w / 900); ctx.globalAlpha = 0.55;
    ctx.lineJoin = "round";
    let t = 0, [px, py] = point(p, 0);
    const step = () => {
      ctx.beginPath(); ctx.moveTo(w / 2 + px * s, h / 2 + py * s);
      for (let i = 0; i < perFrame && t < T; i++) {
        t += dt; [px, py] = point(p, t);
        ctx.lineTo(w / 2 + px * s, h / 2 + py * s);
      }
      ctx.stroke();
      if (t < T) raf = requestAnimationFrame(step);
    };
    step();
  }

  $("rand").addEventListener("click", () => {
    const pairs = [[1,2],[2,3],[3,4],[3,5],[4,5],[2,5],[1,3],[5,6],[3,7]];
    const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
    $("fx").value = a; $("fy").value = b;
    $("dt").value = (Math.random() * 0.02 + 0.002).toFixed(3);
    $("dm").value = (Math.random() * 0.006 + 0.002).toFixed(3);
    phases = phases.map(() => Math.random() * Math.PI * 2);
    draw();
  });
  $("replay").addEventListener("click", draw);
  inputs.forEach(el => el.addEventListener("input", draw));
  addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  draw();
})();
</script>
